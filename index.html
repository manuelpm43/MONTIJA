<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Visor MONTIJA</title>

    <link rel="stylesheet" href="https://componentes.idee.es/api-idee/assets/css/apiidee.ol.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <div id="app">

 <aside id="sidebar">

    <!-- CABECERA -->
    <section id="logo">
        <img class="logo-escudo" src="logos/Escudo.png" alt="Escudo de la Merindad de Montija">

        <div>
            <h1>Merindad de Montija</h1>
            <p>Visor GIS</p>
        </div>
    </section>

    <!-- BUSCADOR -->
    <section class="bloque bloque-buscador">
        <h2>🔍 Buscar</h2>

        <div class="modo-buscador">
            <button type="button" class="modo-busqueda active" data-modo="serie">Nº de serie</button>
            <button type="button" class="modo-busqueda" data-modo="direccion">Dirección</button>
        </div>

        <div class="contenedor-buscador">

    <input
        id="buscador"
        type="text"
        placeholder="Buscar por número de serie..."
        autocomplete="off"
    >

    <div id="sugerencias" class="sugerencias-buscador"></div>

</div>
    </section>

    <!-- ÁRBOL DE CAPAS -->
 <section class="bloque bloque-capas">

    <h2>📂 Selector</h2>

    <!-- DIRECCIONES -->
    <details class="grupo-capas" open>

        <summary>
            <span class="flecha-grupo"></span>
            Direcciones
        </summary>

        <div class="contenido-grupo">

            <label class="fila-capa">
                <input id="checkDirecciones" type="checkbox">
                <span class="simbolo-capa simbolo-punto"></span>
                IGN_DIRECCIONES
            </label>

        </div>

    </details>

    <!-- CONTADORES -->
    <details class="grupo-capas" open>

        <summary>
            <span class="flecha-grupo"></span>
            Contadores
        </summary>

        <div class="contenido-grupo">

            <label class="fila-capa">
                <input id="checkContadores" type="checkbox">
                MONTIJA EPC (ENRIQUECIDA)
            </label>

            <label class="fila-capa fila-subcapa">
                <input id="checkContadoresFalso" type="checkbox" checked>
                <span class="simbolo-capa simbolo-x"></span>
                Falso
            </label>

            <label class="fila-capa fila-subcapa">
                <input id="checkContadoresVerdadero" type="checkbox" checked>
                <span class="simbolo-capa simbolo-punto simbolo-verde"></span>
                Verdadero
            </label>

            <img
                class="leyenda-capa"
                src="https://montija-geoserver.duckdns.org/geoserver/montija/wms?service=WMS&amp;version=1.3.0&amp;request=GetLegendGraphic&amp;format=image/png&amp;layer=montija:contadores_enriquecida&amp;LEGEND_OPTIONS=fontAntiAliasing:true;fontName:Arial;fontSize:11"
                alt="Leyenda de contadores: falso (X roja), verdadero (círculo verde)"
            >

        </div>

    </details>

    <!-- CATASTRO -->
    <details class="grupo-capas" open>

        <summary>
            <span class="flecha-grupo"></span>
            Catastro · 09219 Merindad de Montija
        </summary>

        <div class="contenido-grupo">

            <label class="fila-capa">
                <input id="checkBuildingPart" type="checkbox">
                <span class="simbolo-capa simbolo-punto"></span>
                BUILDING PART
            </label>

            <label class="fila-capa">
                <input id="checkBuilding" type="checkbox">
                <span class="simbolo-capa simbolo-punto"></span>
                BUILDING
            </label>

            <label class="fila-capa">
                <input id="checkOtherConstruction" type="checkbox">
                <span class="simbolo-capa simbolo-punto"></span>
                OTHER CONSTRUCTION
            </label>

            <label class="fila-capa">
                <input id="checkCadastralParcel" type="checkbox">
                <span class="simbolo-capa simbolo-punto"></span>
                CADASTRAL PARCEL
            </label>

        </div>

    </details>

    <!-- CARTOGRAFÍA BASE -->
    <details class="grupo-capas" open>

        <summary>
            <span class="flecha-grupo"></span>
            Cartografía base
        </summary>

        <div class="contenido-grupo">

            <label class="fila-capa">
                <input id="checkNucleos" type="checkbox" checked>
                <span class="simbolo-capa simbolo-punto"></span>
                NÚCLEOS
            </label>

            <label class="fila-capa">
                <input id="checkMunicipios" type="checkbox" checked>
                <span class="simbolo-capa simbolo-punto"></span>
                MUNICIPIOS
            </label>

            <label class="fila-capa capa-pendiente" title="Disponible mediante el selector de fondos del mapa">
                <input id="checkOrtofoto" type="checkbox" disabled>
                <span class="simbolo-capa simbolo-punto"></span>
                ORTOFOTO
            </label>

        </div>

    </details>

</section>

</aside>

        <main id="main">
            <div id="mapa" class="m-container"></div>
        </main>

    </div>

    <!-- VENTANA EMERGENTE: ficha del elemento seleccionado -->
    <div class="overlay-ficha" id="overlayFicha">
        <div class="popup-ficha">

            <div class="cabecera-ficha">
                <span>ℹ Información</span>
                <button class="btn-cerrar-ficha" id="btnCerrarFicha" type="button" aria-label="Cerrar">&times;</button>
            </div>

            <div id="contenidoFicha" class="cuerpo-ficha"></div>

        </div>
    </div>

    <script src="https://componentes.idee.es/api-idee/vendor/browser-polyfill.js"></script>
    <script src="https://componentes.idee.es/api-idee/js/apiidee.ol.min.js"></script>
    <script src="https://componentes.idee.es/api-idee/js/configuration.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/app.js"></script>
    <script src="js/buscador.js"></script>
    <script src="js/capas.js"></script>

</body>

</html>
